name: AI TikTok Content Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
  sudo apt-get update
  sudo apt-get install -y ffmpeg
  pip install google-genai requests gTTS

      - name: Generate content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python generate.py

      - name: Save generated content
        run: |
          git config user.name "TikTok AI Bot"
          git config user.email "actions@github.com"
          git add content/daily_videos.txt
          if ! git diff --cached --quiet; then
            git commit -m "Save daily TikTok scripts"
            git push
          fi
